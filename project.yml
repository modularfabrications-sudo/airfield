name: AirField
options:
  bundleIdPrefix: dev.pages.airfield-app
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en
  xcodeVersion: "26.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""          # pick your team in Xcode → Signing & Capabilities
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    STRING_CATALOG_GENERATE_SYMBOLS: YES
targets:
  AirField:
    type: application
    platform: iOS
    sources:
      - path: AirField
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.pages.airfield-app.ios
        PRODUCT_NAME: AirField
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        SUPPORTS_MACCATALYST: NO
    info:
      path: AirField/Info.plist
      properties:
        CFBundleDisplayName: AirField
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        UIAppFonts: [Anton-Regular.ttf]
        UILaunchScreen:
          UIColorName: ""
          UIImageRespectsSafeAreaInsets: true
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIRequiredDeviceCapabilities: [arm64]
        NSLocationWhenInUseUsageDescription: "AirField uses your location to show flight conditions, sun position and airspace where you are. Your location is only used to look up the forecast for that spot."
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
  AirFieldTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/AirFieldCoreTests
    dependencies:
      - target: AirField
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.pages.airfield-app.ios.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/AirField.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/AirField
        BUNDLE_LOADER: $(TEST_HOST)
schemes:
  AirField:
    build:
      targets:
        AirField: all
        AirFieldTests: [test]
    test:
      targets: [AirFieldTests]
